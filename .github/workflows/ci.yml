name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xray
          POSTGRES_PASSWORD: xray
          POSTGRES_DB: xray_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xray -d xray_dev"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    # CI always uses the mock integration target. No Atlassian/Xray secrets here.
    env:
      CI: 'true'
      NUXT_INTEGRATION_TARGET: mock
      NUXT_MOCK_SERVICES_URL: http://localhost:4010
      NUXT_DATABASE_URL: postgresql://xray:xray@localhost:5432/xray_dev
      NUXT_DATABASE_URL_TEST: postgresql://xray:xray@localhost:5432/xray_test

    steps:
      - uses: actions/checkout@v5

      # Installs the pnpm version pinned in package.json#packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Create .env from template
        run: cp .env.example .env

      - name: Bootstrap
        run: ./scripts/init.sh

      - name: Quality gate (lint, typecheck, unit, build)
        run: pnpm check

      - name: Integration tests
        run: pnpm test:int

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
