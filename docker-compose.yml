# Local development database. Credentials are local-only and not secrets.
# Holds two databases: xray_dev (created here) and xray_test (created by scripts/init.sh).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: xray
      POSTGRES_PASSWORD: xray
      POSTGRES_DB: xray_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xray -d xray_dev']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
